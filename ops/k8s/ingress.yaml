apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cashy-app
  namespace: cashy
  annotations:
    # Uncomment and adjust for your TLS setup:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: cashy.lauko.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cashy-app
                port:
                  number: 80
  # Uncomment for TLS:
  # tls:
  #   - hosts:
  #       - cashy.lauko.io
  #     secretName: cashy-tls
