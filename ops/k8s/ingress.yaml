apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: money-ts-app
  namespace: money-ts
  annotations:
    # Uncomment and adjust for your TLS setup:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: money.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: money-ts-app
                port:
                  number: 80
  # Uncomment for TLS:
  # tls:
  #   - hosts:
  #       - money.example.com
  #     secretName: money-ts-tls
