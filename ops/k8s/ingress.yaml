apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cashy-app
  namespace: cashy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: cashy-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cashy.lauko.io
      secretName: cashy-app-tls
  rules:
    - host: cashy.lauko.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cashy-app
                port:
                  number: 80
